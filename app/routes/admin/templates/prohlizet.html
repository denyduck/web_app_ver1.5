{% import "macros_jinja/makra.jinja2" as makra %}

<!DOCTYPE html>
<html lang="cs">

  <head>
    <!--importy a meta data stranky-->
    {{ makra.header() }}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <style>
      .file-preview {
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
    </style>
    <!--pojmenovani stranky-->
    {{ makra.title("prohlizet") }}
  </head>

  <body data-bs-theme="dark">
    <!-- Navigační lišta -->
    {{ makra.navbar(False) }}
    <div class="container my-5">

      <!-- Nadpis + ovládání -->
      <div class="row mb-4 g-3 align-items-center">
        <div class="col-12">
          <h1 class="mb-4">Seznam bezpečnostních listů</h1>
        </div>
        <div class="col-md-6">
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input type="text" class="form-control" id="searchInput"
                   placeholder="Hledat podle názvu nebo obsahu..." autocomplete="off">
            <button class="btn btn-outline-secondary" id="clearSearch" type="button"
                    style="display:none"><i class="bi bi-x-lg"></i></button>
          </div>
        </div>
        <div class="col-md-3">
          <select class="form-select" id="sortSelect">
            <option value="az">Název A → Z</option>
            <option value="za">Název Z → A</option>
          </select>
        </div>
        <div class="col-md-3 text-md-end">
          <span id="fileCount" class="text-muted small"></span>
        </div>
      </div>

      <!-- Mřížka karet -->
      <div id="fileGrid" class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4"></div>

      <!-- Stránkování -->
      <div id="paginationContainer" class="d-flex justify-content-center mt-5"></div>

    </div>

    <div class="modal fade" id="pdfModal" tabindex="-1" aria-labelledby="pdfModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-scrollable modal-xl">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="pdfModalLabel">Náhled PDF</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Zavřít"></button>
          </div>
          <div class="modal-body">
            <iframe id="pdfIframe" style="width: 100%; height: 80vh;" frameborder="0"></iframe>
          </div>
        </div>
      </div>
    </div>

    <!-- Boční vertikální menu (volitelné) -->
    <!-- {{ makra.sidebar() }} -->

    <!-- Paticka -->
    {{ makra.footer_dve() }}

  </body>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Odkaz na vlastní JavaScript soubor -->
  <script src="{{ url_for('static', filename='js/vendor/prohlizet.js') }}"></script>

</html>
